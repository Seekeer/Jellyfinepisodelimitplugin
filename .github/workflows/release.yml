name: Release

# Push a tag like "v2.0.1.0" (must match <Version> in the csproj). The job
# builds the plugin for Jellyfin 12.2, publishes the zip as a GitHub release
# and records the version in manifest.json on main, which is the plugin
# catalog Jellyfin reads.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v2.0.1.0)
        required: true
      changelog:
        description: Changelog line for the catalog
        required: false

permissions:
  contents: write

env:
  PLUGIN_GUID: a1b2c3d4-e5f6-7890-abcd-ef1234567890
  TARGET_ABI: 12.2.0.0

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check tag matches the csproj version
        run: |
          version="${TAG#v}"
          grep -q "<Version>${version}</Version>" Jellyfin.Plugin.EpisodeLimit.csproj \
            || { echo "Tag $TAG does not match <Version> in the csproj"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish
        run: dotnet publish Jellyfin.Plugin.EpisodeLimit.csproj -c Release -o out

      - name: Package
        # Jellyfin provides every referenced assembly; ship only the plugin.
        run: |
          zip_name="EpisodeLimit_${VERSION}.zip"
          (cd out && zip -X "../$zip_name" Jellyfin.Plugin.EpisodeLimit.dll)
          echo "ZIP=$zip_name" >> "$GITHUB_ENV"
          echo "MD5=$(md5sum "$zip_name" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "Episode Limit $VERSION for Jellyfin 12.2+ (.NET 10). MD5 of $ZIP: $MD5"

      - name: Record the version in the catalog
        env:
          CHANGELOG: ${{ github.event.inputs.changelog }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          changelog="${CHANGELOG:-$(git tag -l --format='%(contents:subject)' "$TAG")}"
          python3 tools/manifest_add_version.py \
            --guid "$PLUGIN_GUID" --version "$VERSION" --target-abi "$TARGET_ABI" \
            --source-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ZIP" \
            --checksum "$MD5" --changelog "$changelog"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "catalog: Episode Limit $VERSION"
          git push origin main
