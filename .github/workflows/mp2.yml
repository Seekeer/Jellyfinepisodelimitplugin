name: MP2 Audio Compatibility

on:
  push:
    branches: [main]
    paths:
      - 'plugins/Jellyfin.Mp2Compatibility/**'
      - 'plugins/Jellyfin.Mp2Compatibility.Tests/**'
      - '.github/workflows/mp2.yml'
  pull_request:
    branches: [main]
    paths:
      - 'plugins/Jellyfin.Mp2Compatibility/**'
      - 'plugins/Jellyfin.Mp2Compatibility.Tests/**'
      - '.github/workflows/mp2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Extract trusted Web fixture from stopped image
        run: |
          mkdir -p artifacts/jellyfin-mp2/fixture
          fixture_container=$(docker create jellyfin/jellyfin@sha256:357724bf0ae27a672c7cbaa899db2d9abeb13dbd8657ccce750258a4c059d037)
          trap 'docker rm "$fixture_container" >/dev/null' EXIT
          docker cp "$fixture_container:/jellyfin/jellyfin-web/main.jellyfin.bundle.js" artifacts/jellyfin-mp2/fixture/main.jellyfin.bundle.js
      - name: Test trusted Web fixture
        env:
          MP2_BUNDLE_PATH: ${{ github.workspace }}/artifacts/jellyfin-mp2/fixture/main.jellyfin.bundle.js
        run: dotnet test plugins/Jellyfin.Mp2Compatibility.Tests/Jellyfin.Mp2Compatibility.Tests.csproj -c Release
      - name: Package plugin
        run: python3 plugins/Jellyfin.Mp2Compatibility/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: MP2-Audio-Compatibility
          path: |
            artifacts/jellyfin-mp2/*.zip
            artifacts/jellyfin-mp2/*SUMS
          if-no-files-found: error
